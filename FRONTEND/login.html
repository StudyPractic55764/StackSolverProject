<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - UOCTandem</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheets" href="style.css">
    <link rel="stylesheet" href="styleindex.css">
</head>
<body>
    <!--Barra superior de navegación-->
    <nav class="barraSuperior">
        <a class="navbar-brand fw-bold logo" href="index.html">StackSolvers</a>
        <a class="nav-link" href="index.html">Dashboard</a>
        <a class="nav-link" href="login.html">Login</a>
        <a class="nav-link" href="intercambios.html">Intercambios</a>
        <a class="nav-link" href="alta_usuario.html">Alta Usuario</a>
        <span class="navbar-text fw-bold text-primary" id="userLoggedIn">-no login-</span>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow login-card fade-in">
                    <div class="card-header bg-white text-center border-0 pt-4">
                        <h3 class="fw-bold">Iniciar Sesión</h3>
                    </div>
                    <div class="card-body p-4">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email" placeholder="lucia@example.com" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" placeholder="•••" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Iniciar Sesión</button>
                        </form>
                        <div id="mensaje" class="mt-3 text-center"></div>
                    </div>
                </div>
                <div class="text-center mt-3 text-muted">
                    <small>© 2026 UOC</small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="login.js"></script>
</body>
</html>
