<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StackSolvers Dashboard</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >
    <link href="styleindex.css" rel="stylesheet">
    <link rel="stylesheet" href="style_alta_usuario.css">
</head>
<body>
    
    <!--Barra superior de navegación-->
    <nav class="barraSuperior">
        <a class="navbar-brand fw-bold logo" href="index.html">StackSolvers</a>
        <a class="nav-link" href="index.html">Dashboard</a>
        <a class="nav-link" href="login.html">Login</a>
        <a class="nav-link" href="intercambios.html">Intercambios</a>
        <a class="nav-link" href="alta_usuario.html">Alta Usuario</a>
        <span class="navbar-text fw-bold text-primary" id="userLoggedIn">-no login-</span>
    </nav>   
    
    <header class="container py-4">
        <h1>Gestión Usuarios</h1>
    </header>

    <main class="container pb-5">

        <!--Usamos row de Bootstrap para crear dos columnas-->
        <div class="row g-4">
            
            <!--Columna izquierda - Formulario-->
            <!---->
            <div class="col-12 col-md-6">
                <section aria-labelledby="titulo-formulario" class="cuadrado p-4 shadow-sm">
                    <h2 id="titulo-formulario" class="mb-4">Introducir datos del usuario:</h2>
                    
                    <form id="form-usuario">
                
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" id="nombre" name="nombre" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" name="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" name="password" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Registrar usuario</button>
                    </form>
                </section>
            </div>

            <!--Columna derecha - Listado de usuarios-->
            <div class="col-12 col-md-6">
                <section aria-labelledby="titulo-listado" class="cuadrado p-4 shadow-sm">
                    <h2 id="titulo-listado" class=" titulo-lista mb-4">Lista de usuarios</h2>
                    
                    <div id="listado-usuarios" class="row g-3"></div>
            
                </section>
            </div>
        </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="alta_usuario.js"></script>

</body>
    
</html>
