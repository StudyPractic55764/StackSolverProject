<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de intercambios</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="./styleindex.css">
</head>
<body>
    <!--Barra superior de navegación-->
    <nav class="barraSuperior">
        <a class="navbar-brand fw-bold logo" href="index.html">StackSolvers</a>
        <a class="nav-link" href="index.html">Dashboard</a>
        <a class="nav-link" href="login.html">Login</a>
        <a class="nav-link" href="intercambios.html">Intercambios</a>
        <a class="nav-link" href="alta_usuario.html">Alta Usuario</a>
        <span class="navbar-text fw-bold text-primary" id="userLoggedIn">-no login-</span>
    </nav>
    
    <header class="container py-4">
        <h1>Gestión de intercambios de idiomas</h1>
    </header>

    <main class="container pb-5">
        <section aria-labelledby="titulo-formulario" class="mb-5">
            <h2 id="titulo-formulario">Publicar un intercambio</h2>
            <form id="form-intercambio">
                <div class="mb-3">
                    <label for="tipo" class="form-label">Tipo de intercambio</label>
                    <select id="tipo" name="tipo" class="form-select" required>
                        <option value="">Selecciona una opción</option>
                        <option value="oferta">Oferta</option>
                        <option value="peticion">Petición</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="titulo" class="form-label">Título</label>
                    <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        class="form-control"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="idioma" class="form-label">Idioma</label>
                    <input 
                        type="text" 
                        id="idioma" 
                        name="idioma" 
                        class="form-control" 
                        required>
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea
                        id="descripcion"
                        name="descripcion"
                        rows="4"
                        class="form-control"
                        required
                    ></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Publicar intercambio</button>
            </form>
        </section>

        <section aria-labelledby="titulo-listado">
            <h2 id="titulo-listado">Intercambios publicados</h2>
            <div id="listado-intercambios" class="row g-3"></div>
        </section>
    </main>

    <script type="module" src="./intercambios.js"></script>
</body>
</html>
